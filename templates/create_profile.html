<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Criar perfil — Linkflix</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#fff;background:#030303}body{min-height:100vh;background:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,.68)),url("{{ url_for('static',filename='images/profiles-premium-bg.png') }}?v=20") center/cover fixed no-repeat}.wrap{min-height:100vh;display:grid;place-items:center;padding:28px}.panel{width:min(640px,95vw);padding:45px 42px 38px;border-radius:24px;background:linear-gradient(160deg,rgba(12,12,12,.96),rgba(3,3,3,.98));border:1px solid rgba(237,11,26,.7);box-shadow:0 0 42px rgba(237,11,26,.28),inset 0 1px rgba(255,255,255,.04);position:relative;text-align:center}.panel:before{content:"";position:absolute;left:8%;right:8%;top:-1px;height:3px;background:linear-gradient(90deg,transparent,#ff2535,transparent);box-shadow:0 0 18px #ed0b1a}.mark{font-size:92px;line-height:.85;color:#e50914;font-style:italic;font-weight:1000;text-shadow:0 0 22px rgba(229,9,20,.65);margin-bottom:7px}.title{font-size:33px;font-weight:1000;margin:0}.title span{color:#ed0b1a}.subtitle{color:#aaa;font-size:18px;margin:7px 0 30px}.field{position:relative;margin-bottom:17px}.field input{width:100%;height:68px;border:1px solid #453436;border-radius:11px;background:linear-gradient(100deg,#151515,#0c0c0c);padding:0 20px 0 64px;color:#fff;font-size:20px;outline:none}.field input:focus{border-color:#ed0b1a;box-shadow:0 0 0 3px rgba(229,9,20,.12)}.ico{position:absolute;left:23px;top:50%;transform:translateY(-50%);color:#ed0b1a;font-size:28px}.upload{display:block;border:1px dashed rgba(229,9,20,.58);border-radius:11px;padding:15px;margin:0 0 18px;color:#bbb;cursor:pointer}.upload b{color:#ed0b1a}.upload input{display:none}.primary,.secondary{width:100%;height:68px;border-radius:11px;font-size:20px;font-weight:900;cursor:pointer}.primary{border:1px solid #ff4050;color:#fff;background:linear-gradient(#ff1628,#a5000c);box-shadow:0 9px 28px rgba(229,9,20,.3)}.or{display:flex;align-items:center;gap:14px;margin:13px 0;color:#ed0b1a}.or:before,.or:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#ed0b1a)}.secondary{display:grid;place-items:center;border:1px solid #ed0b1a;color:#fff;background:#050505;text-decoration:none}.error{padding:11px;border-radius:9px;background:rgba(229,9,20,.17);color:#ff8b93;margin-bottom:16px}@media(max-width:650px){.wrap{padding:14px}.panel{padding:34px 20px 26px}.mark{font-size:72px}.title{font-size:27px}.field input,.primary,.secondary{height:59px;font-size:17px}}
</style></head><body><main class="wrap"><section class="panel"><div class="mark">L</div><h1 class="title">CRIAR <span>PERFIL</span></h1><p class="subtitle">Crie seu perfil e comece sua experiência</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post" enctype="multipart/form-data"><label class="field"><span class="ico">♙</span><input name="name" placeholder="Nome do Perfil" maxlength="40" required></label><label class="field"><span class="ico">↗</span><input type="url" name="avatar_url" placeholder="URL do Avatar (opcional)"></label><label class="upload"><b>Escolher imagem do avatar</b><input type="file" name="avatar_file" accept="image/png,image/jpeg,image/webp"></label><button class="primary" type="submit">Criar Perfil &nbsp; →</button></form><div class="or">OU</div><a class="secondary" href="{{ url_for('select_profile_page') }}">← &nbsp; Voltar para Seleção de Perfis</a></section></main></body></html>
