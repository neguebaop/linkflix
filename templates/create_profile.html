<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Criar perfil — Linkflix</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#fff;background:#030303}
body{min-height:100vh;background:linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.5)),url("{{ url_for('static',filename='images/profiles-premium-bg.png') }}?v=21") center/cover fixed no-repeat;overflow-x:hidden}
.wrap{min-height:100vh;display:grid;place-items:center;padding:32px}
.panel{width:min(650px,94vw);padding:42px 42px 38px;border-radius:28px;background:linear-gradient(155deg,rgba(12,12,12,.975),rgba(2,2,2,.99));border:1px solid rgba(255,36,52,.72);box-shadow:0 0 32px rgba(237,11,26,.18),0 26px 80px rgba(0,0,0,.62),inset 0 1px rgba(255,255,255,.05);position:relative;text-align:center;animation:panelIn .55s cubic-bezier(.2,.8,.2,1) both}
.panel:before,.panel:after{content:"";position:absolute;left:9%;right:9%;height:3px;background:linear-gradient(90deg,transparent,#ff3444 35%,#fff 50%,#ff3444 65%,transparent);box-shadow:0 0 17px #e50914;opacity:.9}.panel:before{top:-1px}.panel:after{bottom:-1px}
.brand-mark{width:92px;height:110px;margin:0 auto 2px;position:relative;filter:drop-shadow(0 0 14px rgba(255,20,38,.55));transform:skew(-8deg)}
.brand-mark:before{content:"";position:absolute;left:29px;top:2px;width:34px;height:83px;background:linear-gradient(105deg,#ff3544 0%,#e50914 47%,#84000a 100%);clip-path:polygon(22% 0,100% 0,72% 100%,0 100%)}
.brand-mark:after{content:"";position:absolute;left:22px;bottom:10px;width:62px;height:28px;background:linear-gradient(100deg,#7c0008,#ff172a 62%,#b4000e);clip-path:polygon(0 0,62% 0,100% 100%,10% 100%)}
.brand-shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.7) 46%,transparent 60%);mix-blend-mode:screen;animation:shine 2.8s ease-in-out infinite;clip-path:polygon(20% 0,70% 0,67% 65%,88% 92%,30% 92%,0 65%)}
.title{font-size:34px;font-weight:1000;letter-spacing:-.9px;margin:-4px 0 0;text-shadow:0 3px 13px rgba(0,0,0,.8)}.title span{color:#ed0b1a}.subtitle{color:#aaa;font-size:18px;margin:8px 0 28px}
.field{position:relative;margin-bottom:16px;display:block}.field input{width:100%;height:66px;border:1px solid #4a3639;border-radius:11px;background:linear-gradient(100deg,#171717,#0b0b0b);padding:0 20px 0 66px;color:#fff;font-size:19px;outline:none;transition:border-color .2s,box-shadow .2s,transform .2s}.field:hover input{border-color:rgba(229,9,20,.68);transform:translateY(-1px)}.field input:focus{border-color:#ed0b1a;box-shadow:0 0 0 3px rgba(229,9,20,.13),0 0 20px rgba(229,9,20,.12)}
.ico{position:absolute;left:22px;top:50%;transform:translateY(-50%);width:25px;height:25px;color:#ed0b1a;z-index:2}.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.upload{display:flex;align-items:center;justify-content:center;gap:10px;border:1px dashed rgba(229,9,20,.65);border-radius:11px;padding:14px;margin:0 0 18px;color:#bbb;cursor:pointer;transition:.25s}.upload:hover{background:rgba(229,9,20,.07);border-color:#ff3344;transform:translateY(-1px)}.upload b{color:#ff2637}.upload input{display:none}
.primary,.secondary{width:100%;height:66px;border-radius:11px;font-size:19px;font-weight:900;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s}.primary{border:1px solid #ff4050;color:#fff;background:linear-gradient(#ff182b,#aa000d);box-shadow:0 10px 25px rgba(229,9,20,.26)}.primary:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(229,9,20,.4);background:linear-gradient(#ff2b3c,#c00010)}.or{display:flex;align-items:center;gap:14px;margin:13px 0;color:#ed0b1a}.or:before,.or:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#ed0b1a)}.or:after{background:linear-gradient(90deg,#ed0b1a,transparent)}.secondary{display:grid;place-items:center;border:1px solid #ed0b1a;color:#fff;background:#050505;text-decoration:none}.secondary:hover{transform:translateY(-2px);background:rgba(229,9,20,.07);box-shadow:0 10px 25px rgba(229,9,20,.15)}.error{padding:11px;border-radius:9px;background:rgba(229,9,20,.17);color:#ff8b93;margin-bottom:16px}
@keyframes panelIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}@keyframes shine{0%,55%{transform:translateX(-120%)}75%,100%{transform:translateX(120%)}}
@media(max-width:650px){.wrap{padding:14px}.panel{padding:30px 19px 25px;border-radius:21px}.brand-mark{transform:scale(.82) skew(-8deg);margin-top:-10px;margin-bottom:-9px}.title{font-size:27px}.subtitle{font-size:15px;margin-bottom:22px}.field input,.primary,.secondary{height:58px;font-size:16px}.field input{padding-left:57px}.ico{left:19px;width:22px;height:22px}}
</style>
</head>
<body>
<main class="wrap"><section class="panel">
<div class="brand-mark" aria-label="Linkflix"><span class="brand-shine"></span></div>
<h1 class="title">CRIAR <span>PERFIL</span></h1><p class="subtitle">Crie seu perfil e comece sua experiência</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" enctype="multipart/form-data">
<label class="field"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg></span><input name="name" placeholder="Nome do Perfil" maxlength="40" required></label>
<label class="field"><span class="ico"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"/></svg></span><input type="url" name="avatar_url" placeholder="URL do Avatar (opcional)"></label>
<label class="upload"><b>Escolher imagem do avatar</b><input type="file" name="avatar_file" accept="image/png,image/jpeg,image/webp"></label>
<button class="primary" type="submit">Criar Perfil &nbsp; →</button></form>
<div class="or">OU</div><a class="secondary" href="{{ url_for('select_profile_page') }}">← &nbsp; Voltar para Seleção de Perfis</a>
</section></main></body></html>
