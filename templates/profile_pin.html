<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PIN do perfil</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050506 url("{{ url_for('static',filename='images/profiles-premium-bg.png') }}") center/cover fixed;color:#fff;font-family:Arial,sans-serif}.box{width:min(420px,92vw);padding:34px;border:1px solid #e50920;border-radius:20px;background:rgba(5,5,6,.94);text-align:center;box-shadow:0 0 35px rgba(229,9,32,.25)}img{width:105px;height:105px;border-radius:20px;object-fit:cover;border:2px solid #e50920}h1{font-size:25px;margin:17px 0 6px}p{color:#aaa}.pins{display:flex;gap:10px;justify-content:center;margin:24px 0}.pins input{width:56px;height:62px;text-align:center;font-size:29px;color:#fff;background:#171719;border:1px solid #45454b;border-radius:10px;outline:none}.pins input:focus{border-color:#e50920;box-shadow:0 0 0 3px rgba(229,9,32,.14)}button,a{height:49px;border-radius:10px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-weight:800}button{width:100%;border:0;background:#e50920;color:#fff;font-size:16px;cursor:pointer}a{margin-top:10px;border:1px solid #444;color:#ddd}.error{color:#ff5362;margin-top:12px}</style></head><body><form class="box" method="post"><img src="{{ profile.avatar }}"><h1>{{ profile.name }}</h1><p>Digite o PIN de 4 números</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<div class="pins"><input name="d1" maxlength="1" inputmode="numeric"><input name="d2" maxlength="1" inputmode="numeric"><input name="d3" maxlength="1" inputmode="numeric"><input name="d4" maxlength="1" inputmode="numeric"><input type="hidden" name="pin" id="pin"></div><button>Entrar no perfil</button><a href="{{ url_for('select_profile_page') }}">Voltar</a></form><script>const xs=[...document.querySelectorAll('.pins input:not([type=hidden])')];xs.forEach((x,i)=>{x.addEventListener('input',()=>{x.value=x.value.replace(/\D/g,'').slice(0,1);if(x.value&&xs[i+1])xs[i+1].focus();document.getElementById('pin').value=xs.map(e=>e.value).join('')});x.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!x.value&&xs[i-1])xs[i-1].focus()})});xs[0].focus()</script></body></html>
