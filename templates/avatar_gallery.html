<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escolha um ícone</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}.top{position:sticky;top:0;z-index:5;padding:18px 3vw;background:linear-gradient(#050505 78%,transparent);display:flex;align-items:center;gap:14px}.top a{color:#fff;text-decoration:none;font-size:28px}.top h1{margin:0;font-size:25px}.content{padding:8px 3vw 60px}.group{margin:20px 0 32px}.group h2{font-size:20px;margin:0 0 12px}.group-logo{max-width:270px;max-height:54px;object-fit:contain;object-position:left center;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}.avatar{padding:0;border:0;background:none;cursor:pointer;transition:.18s}.avatar img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:5px;border:3px solid transparent;display:block}.avatar:hover{transform:scale(1.055);z-index:2}.avatar:hover img{border-color:#fff}.empty{padding:55px 20px;text-align:center;color:#aaa}.empty a{color:#fff}@media(max-width:600px){.grid{grid-template-columns:repeat(4,1fr);gap:5px}.content{padding-left:5px;padding-right:5px}.group h2{font-size:17px}.top h1{font-size:21px}}</style></head><body><header class="top"><a href="{{ url_for('edit_profile',profile_id=profile.id) }}">←</a><h1>Escolha um ícone</h1></header><main class="content">{% if groups %}{% for title,icons in groups.items() %}<section class="group">{% if group_logos.get(title) %}<img class="group-logo" src="{{ group_logos.get(title) }}" alt="{{ title }}">{% else %}<h2>{{ title }}</h2>{% endif %}<div class="grid">{% for icon in icons %}<form method="post"><input type="hidden" name="icon_id" value="{{ icon.id }}"><button class="avatar" title="{{ icon.name }}"><img src="{{ icon.image }}" alt="{{ icon.name }}"></button></form>{% endfor %}</div></section>{% endfor %}{% else %}<div class="empty">Nenhum ícone foi cadastrado pelo administrador ainda.</div>{% endif %}</main></body></html>
