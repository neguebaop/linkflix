<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escolha um ícone</title><style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif}.top{position:sticky;top:0;z-index:2;padding:18px 4vw;background:linear-gradient(#090909 70%,transparent);display:flex;align-items:center;gap:14px}.top a{color:#fff;text-decoration:none;font-size:27px}.top h1{margin:0;font-size:26px}.content{padding:0 4vw 50px}.group{margin:22px 0 34px}.group h2{font-size:22px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}.avatar{padding:0;border:0;background:none;cursor:pointer;transition:.2s}.avatar img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;border:3px solid transparent;display:block}.avatar:hover{transform:scale(1.06);z-index:1}.avatar:hover img{border-color:#fff;box-shadow:0 8px 28px #000}@media(max-width:550px){.grid{grid-template-columns:repeat(4,1fr);gap:7px}.group h2{font-size:18px}.top h1{font-size:21px}}</style></head><body><header class="top"><a href="{{ url_for('edit_profile',profile_id=profile.id) }}">←</a><h1>Escolha um ícone</h1></header><main class="content">{% for title,avatars in groups.items() %}<section class="group"><h2>{{ title }}</h2><div class="grid">{% for avatar in avatars %}<form method="post"><input type="hidden" name="avatar" value="{{ avatar }}"><button class="avatar"><img src="{{ avatar }}" alt="Avatar"></button></form>{% endfor %}</div></section>{% endfor %}</main></body></html>
