<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escolha um ícone</title>
<style>
*{box-sizing:border-box}
:root{--bg:#020202;--panel:#080808;--text:#fff;--muted:#9b9b9b;--red:#e50920}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(circle at 50% -20%,#121212 0,#050505 36%,#010101 72%);color:var(--text);font-family:Inter,Arial,sans-serif}
.top{position:sticky;top:0;z-index:10;height:76px;padding:0 4vw;display:flex;align-items:center;gap:16px;background:linear-gradient(180deg,#020202 0%,rgba(2,2,2,.96) 72%,rgba(2,2,2,0));backdrop-filter:blur(10px)}
.back{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;color:#fff;text-decoration:none;font-size:25px;transition:.18s}
.back:hover{background:#1a1a1a;transform:translateX(-2px)}
.top h1{margin:0;font-size:clamp(22px,2vw,30px);font-weight:800}
.content{max-width:1500px;margin:auto;padding:18px 4vw 70px}
.group{margin:10px 0 38px}
.group-head{min-height:62px;display:flex;align-items:flex-end;margin-bottom:14px}
.group h2{font-size:22px;margin:0;font-weight:800}
.group-logo{display:block;max-width:min(420px,72vw);object-fit:contain;object-position:left bottom;filter:drop-shadow(0 4px 16px rgba(0,0,0,.55))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:9px;align-items:start}
.avatar-form{margin:0}
.avatar{width:100%;padding:0;border:0;background:none;cursor:pointer;position:relative;transition:transform .18s ease;display:block}
.avatar img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px;border:3px solid transparent;display:block;background:#111;transition:border-color .18s,filter .18s,box-shadow .18s}
.avatar:hover{transform:scale(1.07);z-index:2}
.avatar:hover img,.avatar:focus-visible img{border-color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.7);filter:brightness(1.05)}
.avatar:active{transform:scale(.98)}
.empty{padding:70px 20px;text-align:center;color:var(--muted);font-size:17px}
@media(max-width:700px){.top{height:66px;padding:0 14px}.content{padding:8px 8px 45px}.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.group{margin-bottom:26px}.group-head{min-height:42px}.group h2{font-size:18px}.group-logo{max-width:230px}.avatar img{border-width:2px;border-radius:4px}}
</style>
</head>
<body>
<header class="top"><a class="back" href="{{ url_for('edit_profile',profile_id=profile.id) }}">←</a><h1>Escolha um ícone</h1></header>
<main class="content">
{% if groups %}
  {% for title,icons in groups.items() %}
  <section class="group">
    <div class="group-head">
      {% if group_logos.get(title) %}
      <img class="group-logo" style="height:{{ group_logo_sizes.get(title,54) }}px" src="{{ group_logos.get(title) }}" alt="{{ title }}">
      {% else %}<h2>{{ title }}</h2>{% endif %}
    </div>
    <div class="grid">
      {% for icon in icons %}
      <form class="avatar-form" method="post">
        <input type="hidden" name="icon_id" value="{{ icon.id }}">
        <button class="avatar" type="submit" title="Usar {{ icon.name }}"><img src="{{ icon.image }}" alt="{{ icon.name }}" loading="lazy"></button>
      </form>
      {% endfor %}
    </div>
  </section>
  {% endfor %}
{% else %}<div class="empty">Nenhum ícone foi cadastrado pelo administrador ainda.</div>{% endif %}
</main>
</body>
</html>
