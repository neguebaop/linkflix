<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Editar Perfil - Linkflix</title>
  <style>
    :root{--red:#ff1024;--muted:#aaa}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:Arial,Helvetica,sans-serif;color:#fff;background:#040303 url("{{ url_for('static', filename='images/profiles-premium-bg.png') }}") center/cover fixed no-repeat;display:grid;place-items:center;padding:34px 18px}body:before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.32),rgba(0,0,0,.62) 35%,rgba(0,0,0,.62) 65%,rgba(0,0,0,.32));pointer-events:none}.edge{position:fixed;top:50%;transform:translateY(-50%);font-size:75px;font-weight:900;letter-spacing:5px;color:transparent;-webkit-text-stroke:1px rgba(255,20,40,.35);writing-mode:vertical-rl;opacity:.65}.edge.left{left:26px;transform:translateY(-50%) rotate(180deg)}.edge.right{right:26px}
    .modal{position:relative;z-index:1;width:min(690px,96vw);background:linear-gradient(150deg,rgba(11,11,12,.96),rgba(5,5,6,.95));border:1px solid rgba(255,25,43,.6);border-radius:21px;padding:38px 45px 40px;box-shadow:0 32px 90px rgba(0,0,0,.72),0 0 32px rgba(255,0,25,.12)}.modal:before{content:"";position:absolute;left:20%;right:20%;top:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent);box-shadow:0 0 18px var(--red)}
    .close{position:absolute;right:24px;top:23px;width:45px;height:45px;border-radius:50%;display:grid;place-items:center;color:var(--red);font-size:29px;font-weight:300;text-decoration:none;background:rgba(255,15,35,.08);border:1px solid rgba(255,25,45,.45);transition:.2s}.close:hover{background:rgba(255,15,35,.18);transform:rotate(5deg)}h1{text-align:center;margin:7px 0 34px;font-size:29px;text-transform:uppercase}h1 span{color:var(--red)}h1:after{content:"";display:block;width:65px;height:3px;margin:12px auto 0;background:var(--red);box-shadow:0 0 12px var(--red)}
    .avatar{display:flex;justify-content:center;margin-bottom:18px}.avatar img{width:160px;height:160px;border-radius:50%;object-fit:cover;border:5px solid var(--red);box-shadow:0 0 22px rgba(255,15,35,.58)}label{display:block;color:#ddd;font-size:13px;text-transform:uppercase;margin:17px 0 9px}.field{position:relative}.field svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:21px;height:21px;stroke:var(--red);fill:none;stroke-width:1.8}.field input{width:100%;height:53px;border-radius:10px;border:1px solid rgba(255,30,48,.55);background:rgba(16,17,18,.94);color:#fff;padding:0 16px 0 51px;font-size:16px;outline:none}.field input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,16,36,.08)}
    .upload{border:1px dashed rgba(255,20,40,.75);border-radius:12px;min-height:95px;display:grid;place-items:center;text-align:center;position:relative;background:rgba(10,10,11,.65);overflow:hidden}.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}.upload strong{color:var(--red);font-size:16px}.upload small{display:block;color:#bcbcbc;margin-top:9px}.error{margin:14px 0 0;color:#ff5260;text-align:center}.buttons{display:flex;justify-content:space-between;gap:18px;margin-top:30px}.btn{height:50px;border-radius:10px;padding:0 28px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-weight:800;cursor:pointer;font-size:15px}.cancel{border:1px solid rgba(255,40,55,.58);color:#fff;background:rgba(5,5,6,.4);min-width:160px}.save{border:0;color:#fff;background:linear-gradient(135deg,#d70719,#ff1128);box-shadow:0 9px 22px rgba(220,0,20,.28);min-width:220px}.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
    @media(max-width:760px){.edge{display:none}.modal{padding:32px 22px 28px}.avatar img{width:132px;height:132px}.buttons{flex-direction:column-reverse}.btn{width:100%}}
  </style>
</head>
<body>
<div class="edge left">LINKFLIX</div><div class="edge right">LINKFLIX</div>
<section class="modal"><a href="{{ url_for('manage_profiles') }}" class="close" aria-label="Fechar">×</a><h1>Editar <span>Perfil</span></h1>
<form method="POST" enctype="multipart/form-data">
  <div class="avatar"><img src="{% if profile.avatar %}{{ profile.avatar }}{% else %}{{ url_for('static', filename='images/default_profile.png') }}{% endif %}" id="preview" onerror="this.onerror=null;this.src='{{ url_for('static', filename='images/default_profile.png') }}';"></div>
  <label for="name">Nome</label><div class="field"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.2 3.5-6 8-6s7.2 1.8 8 6"/></svg><input id="name" type="text" name="name" value="{{ profile.name }}" placeholder="Nome do perfil" required></div>
  <label for="avatar_url">URL do avatar (opcional)</label><div class="field"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.1-1.1"/></svg><input id="avatar_url" type="text" name="avatar_url" value="{{ profile.avatar }}" placeholder="Cole a URL da imagem aqui"></div>
  <label>Ou envie um avatar (PNG/JPG/WEBP)</label><div class="upload"><div><strong>☁ Escolher arquivo</strong><small id="file-name">Nenhum arquivo escolhido</small></div><input type="file" name="avatar_file" accept="image/*" onchange="previewImage(event)"></div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <div class="buttons"><a href="{{ url_for('manage_profiles') }}" class="btn cancel">Cancelar</a><button type="submit" class="btn save">Salvar alterações</button></div>
</form></section>
<script>function previewImage(event){const f=event.target.files&&event.target.files[0];if(!f)return;document.getElementById('file-name').textContent=f.name;const r=new FileReader();r.onload=()=>document.getElementById('preview').src=r.result;r.readAsDataURL(f)}</script>
</body></html>
