<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ content.title }} - Linkflix</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
  .watch-player-toolbar {
    display:flex; justify-content:flex-end; align-items:center; gap:8px;
    margin:0 0 8px;
  }
  .watch-player-shell {
    position:relative; background:#000; border-radius:14px; overflow:hidden;
    width:100%; aspect-ratio:16/9; min-height:320px;
  }
  .watch-player-shell iframe { display:block; width:100%; height:100%; min-height:320px; border:0; background:#000; }
  .linkflix-fullscreen-btn {
    position:relative; z-index:100;
    display:inline-flex; align-items:center; gap:8px;
    border:1px solid rgba(255,255,255,.24); border-radius:8px;
    padding:7px 10px; color:#fff; background:#e50914;
    font-size:13px; font-weight:800; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.30);
  }
  .linkflix-fullscreen-btn:hover { background:#ff1f2b; transform:translateY(-1px); }
  .linkflix-fullscreen-btn svg { width:14px; height:14px; fill:currentColor; }
  .watch-player-shell.cinema-mode {
    position:fixed; inset:0; z-index:99999; width:100vw; height:100vh;
    aspect-ratio:auto; min-height:100vh; border-radius:0; background:#000;
  }
  .watch-player-shell.cinema-mode iframe { width:100%; height:100%; min-height:100%; }
  .cinema-exit {
    display:none; position:absolute; top:12px; right:12px; z-index:100001;
    border:1px solid rgba(255,255,255,.25); border-radius:8px; padding:7px 10px;
    background:rgba(0,0,0,.72); color:#fff; font-weight:800; cursor:pointer;
  }
  .watch-player-shell.cinema-mode .cinema-exit { display:block; }
  .player-loading {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#ddd; font-weight:700; background:#000; z-index:2; pointer-events:none;
    transition:opacity .25s ease;
  }
  .player-loading.hidden { opacity:0; visibility:hidden; }
  .watch-player-shell:fullscreen,
  .watch-player-shell:-webkit-full-screen { width:100vw; height:100vh; border-radius:0; background:#000; }
  .watch-player-shell:fullscreen iframe,
  .watch-player-shell:-webkit-full-screen iframe { width:100%; height:100%; min-height:100%; }
</style>
</head>

<body class="watch-body">

<div class="watch-topbar">
  <a href="{{ url_for('home') }}" class="watch-back">← Voltar</a>

  <div class="watch-title-wrap">
    <div class="watch-title">{{ content.title }}</div>
    <div class="watch-sub">
      {{ content.content_type }}{% if content.category %} • {{ content.category }}{% endif %}
    </div>
  </div>
</div>

<div class="watch-wrap">
  <div class="watch-player">
    <div class="watch-player-toolbar">
      <button type="button" class="linkflix-fullscreen-btn" id="fullscreenBtn" aria-label="Abrir player em tela cheia">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        <span>⛶ Tela cheia</span>
      </button>
    </div>

    <div class="watch-player-shell" id="playerShell">
      <div class="player-loading" id="playerLoading">Carregando filme...</div>
      <button type="button" class="cinema-exit" id="cinemaExit">✕ Sair</button>
      {% if not is_series %}
        <iframe id="contentFrame"
          data-src="https://playerflixapi.com/filme/{{ content.tmdb_id }}"
          src="about:blank"
          loading="eager"
          sandbox="allow-scripts allow-same-origin allow-forms allow-presentation allow-pointer-lock"
          referrerpolicy="no-referrer"
          allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
          allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true">
        </iframe>
      {% else %}
        <iframe id="seriesFrame"
          src="about:blank"
          loading="eager"
          sandbox="allow-scripts allow-same-origin allow-forms allow-presentation allow-pointer-lock"
          referrerpolicy="no-referrer"
          allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
          allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true">
        </iframe>
      {% endif %}
    </div>

    {% if is_series %}
      <div style="margin-top:15px; display:flex; gap:10px; flex-wrap:wrap;">
        <div><label>Temporada</label><br><select id="seasonSelect"></select></div>
        <div><label>Episódio</label><br><select id="episodeSelect"></select></div>
      </div>
    {% endif %}
  </div>

  <div class="watch-info">
    {% if content.description %}<p class="watch-desc">{{ content.description }}</p>{% endif %}
    <div class="watch-progress-card automatic-progress-hidden">
      <div class="watch-progress-top"><span>Progresso</span><span id="pctText">0%</span></div>
      <div class="watch-progress-bar"><span id="pctBar" style="width:0%"></span></div>
      <div class="watch-progress-actions">
        <button class="btn-ghost" onclick="setProgress(0)">Recomeçar</button>
        <button class="btn-ghost" onclick="setProgress(25)">25%</button>
        <button class="btn-ghost" onclick="setProgress(50)">50%</button>
        <button class="btn-ghost" onclick="setProgress(75)">75%</button>
        <button class="btn-primary" onclick="setProgress(95)">Quase no fim</button>
      </div>
    </div>
  </div>
</div>

<script>
const playerShell = document.getElementById("playerShell");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const cinemaExit = document.getElementById("cinemaExit");
const playerLoading = document.getElementById("playerLoading");
const initialFrame = document.getElementById("contentFrame") || document.getElementById("seriesFrame");

function openCinemaMode(){
  playerShell.classList.add("cinema-mode");
  document.body.style.overflow = "hidden";
}
function closeCinemaMode(){
  playerShell.classList.remove("cinema-mode");
  document.body.style.overflow = "";
}
cinemaExit.addEventListener("click", closeCinemaMode);
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && playerShell.classList.contains("cinema-mode")) closeCinemaMode();
});

// Carrega o player depois que a página já montou. Isso evita o quadro preto em alguns navegadores.
window.addEventListener("DOMContentLoaded", () => {
  if (initialFrame && initialFrame.dataset.src) initialFrame.src = initialFrame.dataset.src;

  // O navegador bloqueia tela cheia real sem clique. Este modo cinema ocupa a tela automaticamente.
  setTimeout(() => {
    if (initialFrame && initialFrame.src && initialFrame.src !== "about:blank") openCinemaMode();
  }, 2200);
});

if (initialFrame) {
  initialFrame.addEventListener("load", () => {
    setTimeout(() => playerLoading.classList.add("hidden"), 500);
  });
}
setTimeout(() => playerLoading.classList.add("hidden"), 10000);

async function toggleFullscreen(){
  const frame = document.getElementById("contentFrame") || document.getElementById("seriesFrame");
  const target = playerShell;

  try {
    closeCinemaMode();
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (target.requestFullscreen) {
        await target.requestFullscreen();
      } else if (target.webkitRequestFullscreen) {
        target.webkitRequestFullscreen();
      } else if (frame && frame.src) {
        window.open(frame.src, "_blank", "noopener,noreferrer");
      }
    } else {
      if (document.exitFullscreen) await document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  } catch (error) {
    console.error("Não foi possível abrir a tela cheia:", error);
    if (frame && frame.src) window.open(frame.src, "_blank", "noopener,noreferrer");
  }
}
fullscreenBtn.addEventListener("click", toggleFullscreen);

function updateFullscreenLabel(){
  const active = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
  fullscreenBtn.querySelector("span").textContent = active ? "✕ Sair da tela cheia" : "⛶ Tela cheia";
}
document.addEventListener("fullscreenchange", updateFullscreenLabel);
document.addEventListener("webkitfullscreenchange", updateFullscreenLabel);

const contentId = {{ content.id }};
const updateUrl = `/progress/update/${contentId}`;
let currentPct = {{ progress_pct|default(0) }};

function paint(pct){
  currentPct = Math.max(0, Math.min(100, pct));
  document.getElementById("pctText").innerText = currentPct + "%";
  document.getElementById("pctBar").style.width = currentPct + "%";
}
async function sendProgressPercent(pct){
  await fetch(updateUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ position:pct, duration:100 })});
}
function setProgress(pct){ paint(pct); sendProgressPercent(pct); }
paint(currentPct);

// O player é externo e não expõe o tempo real por segurança do navegador.
// Ainda assim, o Linkflix salva automaticamente uma estimativa enquanto a página fica aberta,
// permitindo que o título apareça em "Continuar assistindo" sem apertar botões.
let autoStartedAt = Date.now();
let autoPct = Math.max(currentPct || 0, 1);
let lastSavedPct = -1;
async function saveAutomaticProgress(force=false){
  const elapsedMinutes = (Date.now() - autoStartedAt) / 60000;
  const estimated = Math.min(95, Math.max(autoPct, Math.floor(autoPct + elapsedMinutes * 2)));
  if (!force && estimated === lastSavedPct) return;
  lastSavedPct = estimated;
  paint(estimated);
  try { await sendProgressPercent(estimated); } catch(e) {}
}
setTimeout(() => saveAutomaticProgress(true), 8000);
setInterval(() => saveAutomaticProgress(false), 30000);
window.addEventListener('pagehide', () => {
  const elapsedMinutes = (Date.now() - autoStartedAt) / 60000;
  const estimated = Math.min(95, Math.max(autoPct, Math.floor(autoPct + elapsedMinutes * 2)));
  navigator.sendBeacon(updateUrl, new Blob([JSON.stringify({position:estimated,duration:100})], {type:'application/json'}));
});

{% if is_series %}
const TMDB_ID = "{{ content.tmdb_id }}";
const seasonSelect = document.getElementById("seasonSelect");
const episodeSelect = document.getElementById("episodeSelect");
const frame = document.getElementById("seriesFrame");

fetch(`/api/tmdb/tv/${TMDB_ID}/seasons`)
.then(res => res.json())
.then(data => {
  const seasons = data.seasons || [];
  seasons.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s.season_number;
    opt.textContent = s.name;
    seasonSelect.appendChild(opt);
  });
  if (seasons.length) loadEpisodes(seasons[0].season_number);
});

function loadEpisodes(seasonNumber){
  fetch(`/api/tmdb/tv/${TMDB_ID}/season/${seasonNumber}`)
  .then(res => res.json())
  .then(data => {
    episodeSelect.innerHTML = "";
    const eps = data.episodes || [];
    eps.forEach(ep => {
      const opt = document.createElement("option");
      opt.value = ep.episode_number;
      opt.textContent = ep.episode_number + " - " + ep.name;
      episodeSelect.appendChild(opt);
    });
    if (eps.length) loadPlayer(seasonNumber, eps[0].episode_number);
  });
}
function loadPlayer(season, episode){
  playerLoading.classList.remove("hidden");
  frame.src = `https://playerflixapi.com/serie/${TMDB_ID}/${season}/${episode}`;
}
seasonSelect.addEventListener("change", ()=> loadEpisodes(seasonSelect.value));
episodeSelect.addEventListener("change", ()=> loadPlayer(seasonSelect.value, episodeSelect.value));
{% endif %}
</script>
</body>
</html>
