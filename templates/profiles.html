<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerenciar perfis</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050506 url("{{ url_for('static',filename='images/profiles-premium-bg.png') }}") center/cover fixed;color:#fff;font-family:Arial,sans-serif}body:before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.58)}.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:45px 20px}.brand{font-size:56px;font-weight:1000;color:#e50920;letter-spacing:-3px;text-shadow:0 5px 12px #000}h1{font-size:38px;margin:25px 0 36px}.grid{display:flex;gap:30px;justify-content:center;flex-wrap:wrap}.card{width:170px;text-align:center;color:#ddd;text-decoration:none}.pic{width:170px;height:170px;border-radius:18px;position:relative;overflow:hidden;border:2px solid #888;transition:.22s}.pic img{width:100%;height:100%;object-fit:cover;filter:brightness(.75)}.edit{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.25);font-size:43px}.card:hover .pic{border-color:#fff;transform:translateY(-6px) scale(1.03);box-shadow:0 15px 35px #000}.card:hover img{filter:brightness(.95)}.name{margin-top:12px;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.add .pic{display:grid;place-items:center;background:#151518;font-size:70px;border-style:dashed}.done{margin-top:45px;padding:13px 27px;border:1px solid #e50920;border-radius:9px;color:#fff;text-decoration:none;font-weight:800;background:rgba(0,0,0,.55)}.done:hover{background:#e50920}@media(max-width:550px){.page{padding-top:28px}.brand{font-size:42px}h1{font-size:27px;margin:18px 0 28px}.grid{gap:20px 14px}.card,.pic{width:130px}.pic{height:130px}.edit{font-size:34px}}</style></head><body><main class="page"><div class="brand">LINKFLIX</div><h1>Gerenciar perfis</h1><div class="grid">{% for profile in profiles %}<a class="card" href="{{ url_for('edit_profile',profile_id=profile.id) }}"><div class="pic"><img src="{{ profile.avatar }}"><span class="edit">✎</span></div><div class="name">{{ profile.name }}</div></a>{% endfor %}{% if profiles|length < 5 %}<a class="card add" href="{{ url_for('create_profile') }}"><div class="pic">+</div><div class="name">Adicionar perfil</div></a>{% endif %}</div><a class="done" href="{{ url_for('select_profile_page') }}">Concluir</a></main></body></html>
