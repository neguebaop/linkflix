<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerenciar perfis</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}.page{min-height:100vh;padding:28px 5vw 60px}.back{color:#fff;text-decoration:none;font-size:25px}.title{text-align:center;font-size:34px;margin:18px 0 34px}.grid{display:flex;justify-content:center;gap:26px;flex-wrap:wrap}.card{width:165px;text-align:center;color:#ddd;text-decoration:none}.pic{width:165px;height:165px;position:relative;border-radius:8px;overflow:hidden;border:3px solid transparent;transition:.2s}.pic img{width:100%;height:100%;object-fit:cover;filter:brightness(.72)}.edit-overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.35);font-size:38px}.card:hover .pic{border-color:#fff;transform:scale(1.04)}.card:hover img{filter:brightness(.95)}.name{margin-top:10px;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.add .pic{display:grid;place-items:center;background:#151515;border:2px dashed #777;font-size:65px}.done{display:block;width:max-content;margin:42px auto 0;padding:12px 28px;border:1px solid #777;color:#fff;text-decoration:none}.done:hover{border-color:#fff}@media(max-width:550px){.page{padding:18px 12px}.title{font-size:27px}.card,.pic{width:128px}.pic{height:128px}.grid{gap:18px 12px}}</style></head><body><main class="page"><a class="back" href="{{ url_for('select_profile_page') }}">←</a><h1 class="title">Gerenciar perfis</h1><div class="grid">{% for profile in profiles %}<a class="card" href="{{ url_for('edit_profile',profile_id=profile.id) }}"><div class="pic"><img src="{{ profile.avatar }}"><span class="edit-overlay">✎</span></div><div class="name">{{ profile.name }}</div></a>{% endfor %}{% if profiles|length < 5 %}<a class="card add" href="{{ url_for('create_profile') }}"><div class="pic">+</div><div class="name">Adicionar perfil</div></a>{% endif %}</div><a class="done" href="{{ url_for('select_profile_page') }}">Concluir</a></main></body></html>
