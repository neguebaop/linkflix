<!doctype html>

<head>

<title>Entrar — Linkflix</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#fff;background:#030303}body{min-height:100vh;background:linear-gradient(90deg,rgba(0,0,0,.76),rgba(0,0,0,.45),rgba(0,0,0,.76)),url("{{ url_for('static',filename='images/auth-premium-bg.png') }}?v=20") center/cover fixed no-repeat;overflow-x:hidden}.page{min-height:100vh;position:relative;display:flex;align-items:center;justify-content:center;padding:108px 24px 38px}.brand-small{position:absolute;left:34px;top:27px;font-size:28px;font-weight:1000;letter-spacing:-1.5px;text-decoration:none;color:#fff;text-shadow:0 0 12px rgba(255,255,255,.12)}.brand-small b{color:#ed0b1a}.back{position:absolute;right:34px;top:25px;display:flex;gap:10px;align-items:center;padding:13px 22px;border:1px solid #ed0b1a;border-radius:999px;color:#fff;text-decoration:none;font-weight:800;background:rgba(0,0,0,.44)}.hero-logo{position:absolute;top:73px;left:50%;transform:translateX(-50%);font-weight:1000;font-size:clamp(58px,8.4vw,126px);font-style:italic;letter-spacing:-7px;white-space:nowrap;text-shadow:0 8px 24px #000,0 0 18px rgba(237,11,26,.25)}.hero-logo .link{color:#eee}.hero-logo .flix{color:#ed0b1a}.card{width:min(510px,94vw);margin-top:92px;padding:65px 35px 27px;border-radius:18px;background:linear-gradient(155deg,rgba(22,18,19,.96),rgba(4,4,4,.97));border:1px solid rgba(237,11,26,.55);box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 0 35px rgba(237,11,26,.28);position:relative;text-align:center}.badge{position:absolute;top:-29px;left:50%;transform:translateX(-50%);width:62px;height:62px;border-radius:18px;background:#160609;border:2px solid #ed0b1a;display:grid;place-items:center;color:#ed0b1a;font-size:32px;font-weight:1000;box-shadow:0 0 24px rgba(237,11,26,.75)}h1{font-size:27px;margin:0 0 6px}p{margin:0 0 22px;color:#b7b7b7}.field{position:relative;margin:0 0 14px}.field input{width:100%;height:58px;padding:0 50px 0 51px;background:linear-gradient(100deg,#171414,#222);border:1px solid #30292b;border-radius:10px;color:#fff;font-size:17px;outline:none}.field input:focus{border-color:#ed0b1a;box-shadow:0 0 0 3px rgba(237,11,26,.12)}.icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:#ed0b1a;font-size:20px}.toggle{position:absolute;right:16px;top:50%;transform:translateY(-50%);border:0;background:none;color:#999;font-size:19px;cursor:pointer}.submit{width:100%;height:58px;border:1px solid #ff5360;border-radius:10px;color:#fff;font-size:18px;font-weight:900;background:linear-gradient(#ff1829,#a8000c);box-shadow:0 8px 24px rgba(229,9,20,.32);cursor:pointer}.submit:hover{filter:brightness(1.12)}.error{margin:0 0 14px;padding:10px;border-radius:8px;background:rgba(229,9,20,.18);color:#ff8790}.divider{display:flex;align-items:center;gap:12px;color:#8e8e8e;margin:20px 0 16px;font-size:13px}.divider:before,.divider:after{content:"";height:1px;flex:1;background:#292929}.socials{display:flex;justify-content:center;gap:14px}.social{width:92px;height:56px;border:1px solid #2e2e2e;border-radius:10px;background:#151515;color:#fff;font-size:26px;display:grid;place-items:center}.signup{margin-top:20px;color:#d0d0d0;font-size:15px}.signup a{color:#ff1727;text-decoration:none;font-weight:900}

</head><body><main class="page"><a class="brand-small" href="/"><span>LINK</span><b>FLIX</b></a><a class="back" href="/">← Voltar</a><div class="hero-logo"><span class="link">LINK</span><span class="flix">FLIX</span></div><section class="card"><div class="badge">L</div><h1>Entrar na sua conta</h1><p>Acesse seus filmes, séries e muito mais.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><label class="field"><span class="icon">✉</span><input type="email" name="email" placeholder="Email" autocomplete="email" required></label><label class="field"><span class="icon">♙</span><input id="password" type="password" name="password" placeholder="Senha" autocomplete="current-password" required><button class="toggle" type="button" onclick="const p=document.getElementById('password');p.type=p.type==='password'?'text':'password'">◉</button></label><button class="submit" type="submit">Entrar &nbsp; →</button></form><div class="divider">ou continue com</div><div class="socials"><div class="social">G</div><div class="social">●</div></div><div class="signup">Não tem conta? <a href="{{ url_for('register') }}">Criar conta</a></div></section></main></body></html>
